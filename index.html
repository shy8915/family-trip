<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d6a61">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="여행수첩">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>우리 가족 여행수첩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f4f1; --surface:#ffffff; --ink:#16282a; --muted:#5d6f6f; --line:#d3dbd6;
  --accent:#0d6a61; --accent-ink:#ffffff; --accent-soft:#dcece8;
  --stay:#b7791a; --food:#b4533c; --sight:#0d6a61; --move:#51679a; --etc:#6b7676;
  --warn:#a23a2a; --warn-soft:#f6e2de;
  --display:"Gowun Batang","Noto Serif KR",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1919; --surface:#172525; --ink:#e3ebe8; --muted:#94a6a3; --line:#2b3d3c;
    --accent:#57c2b2; --accent-ink:#062421; --accent-soft:#1d3a37;
    --stay:#e0aa52; --food:#e58a73; --sight:#57c2b2; --move:#93a8dc; --etc:#9aa7a5;
    --warn:#ee8a78; --warn-soft:#3a211d; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
main{max-width:760px;margin:0 auto;padding:16px 16px 96px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:1.55rem} h2{font-size:1.3rem} h3{font-size:1.06rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500;min-height:42px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn)}
.btn.sm{padding:5px 10px;min-height:34px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:14px}
.grow{flex:1 1 auto;min-width:0}
.note{font-size:.86rem;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:9px 12px}
.note.warn{color:var(--warn);border-color:var(--warn)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sync{font-size:.78rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--etc)}
.sync.on::before{background:var(--accent)} .sync.err::before{background:var(--warn)}

.group-label{font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:.04em}
.trips{display:flex;flex-direction:column;gap:10px}
.trip{display:flex;gap:14px;align-items:stretch;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.trip .stub{flex:0 0 70px;border-right:1px dashed var(--line);padding-right:12px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.trip .stub b{font-family:var(--display);font-size:1.22rem;color:var(--accent)}
.trip .stub span{font-size:.76rem;color:var(--muted)}
.trip h3,.card h3,.card p,.head h1{overflow-wrap:anywhere}
.trip.past .stub b{color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted)}

.head{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.tabs{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.tabs button{flex:1;border:0;background:transparent;padding:10px 4px;font-weight:500;min-height:44px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.day-chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;text-align:center;min-width:64px}
.day-chip b{display:block;font-size:.92rem}
.day-chip span{font-size:.76rem;color:var(--muted)}
.day-chip[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.day-chip[aria-selected="true"] span{color:var(--accent)}

.weather{display:flex;gap:4px 12px;align-items:baseline;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.weather b{font-size:1.02rem}
.wx-src{flex-basis:100%;font-size:.76rem;color:var(--muted)}

.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:50px 18px 1fr;column-gap:8px}
.item .t{font-weight:600;padding-top:12px;text-align:right}
.rail{position:relative}
.item .rail::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
.item .rail::after{content:attr(data-n);position:absolute;left:-2px;top:12px;width:22px;height:22px;border-radius:50%;background:var(--k);color:#fff;font-size:.72rem;font-weight:600;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.timeline > li:first-child .rail::before{top:20px}
.timeline > li:last-child .rail::before{bottom:calc(100% - 22px)}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--k);border-radius:12px;padding:10px 12px;margin:6px 0;display:flex;flex-direction:column;gap:4px;min-width:0}
.kind{font-size:.76rem;font-weight:600;color:var(--k)}
.leg{display:grid;grid-template-columns:50px 18px 1fr;column-gap:8px}
.leg .rail::before{content:"";position:absolute;left:8px;top:0;bottom:0;border-left:2px dashed var(--line)}
.leg .body{font-size:.86rem;color:var(--muted);padding:4px 0 4px 4px;display:flex;gap:2px 10px;flex-wrap:wrap;align-items:baseline}
.leg .body b{color:var(--ink)}
.leg .body .bad{color:var(--warn);font-weight:600}
.k-stay{--k:var(--stay)} .k-food{--k:var(--food)} .k-sight{--k:var(--sight)} .k-move{--k:var(--move)} .k-etc{--k:var(--etc)}

#map{width:100%;height:56vh;min-height:320px;border-radius:14px;border:1px solid var(--line);overflow:hidden;background:var(--surface)}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--k);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.pin span{transform:rotate(45deg);color:#fff;font:600 12px/1 var(--body)}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.legend li{display:grid;grid-template-columns:26px 48px 1fr;gap:8px;align-items:baseline}
.dot{width:22px;height:22px;border-radius:50%;background:var(--k);color:#fff;font-size:.72rem;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.keyline{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.keyline i{display:inline-block;width:22px;border-top:3px solid;vertical-align:middle;margin-right:5px}

.ov-day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.ov-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ov-list li{display:grid;grid-template-columns:50px 1fr auto;gap:8px;border-left:3px solid var(--k);padding-left:8px}
.ov-list li span{overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:1.15rem}
.stat span{font-size:.78rem;color:var(--muted)}

.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.check li{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.check input[type=checkbox]{width:22px;height:22px;min-height:0;flex:0 0 auto;accent-color:var(--accent)}
.check li.done span{text-decoration:line-through;color:var(--muted)}
.check span{flex:1;overflow-wrap:anywhere}

dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:0;width:min(580px,calc(100vw - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(8,20,20,.5)}
dialog form{padding:18px 16px;display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:.86rem;font-weight:500;color:var(--muted)}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);color:var(--ink);font-size:16px;min-height:42px;width:100%}
textarea{min-height:72px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
.err{color:var(--warn);font-size:.86rem} .err:empty{display:none}
.results{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:210px;overflow:auto}
.results:empty{display:none}
.results button{width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
.results b{display:block}
.picked{font-size:.84rem;color:var(--accent);font-weight:500} .picked:empty{display:none}
fieldset{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;margin:0}
legend{font-weight:600;font-size:.9rem;padding:0 6px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.8rem;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:0}
pre:empty{display:none}
footer{font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 16px;font-size:.88rem;max-width:calc(100vw - 32px);display:none;z-index:50}
</style>
</head>
<body>
<main>
  <div class="topbar">
    <span class="sync" id="sync">이 기기에 저장</span>
    <button class="btn sm" data-act="settings">설정</button>
  </div>
  <div id="view"></div>
  <footer>지도·장소·경로: 카카오맵 API, 카카오모빌리티 길찾기 API · 날씨: 기상청 단기예보 조회서비스(공공데이터포털)</footer>
</main>
<div id="toast" role="status"></div>

<dialog id="dlgTrip"><form id="fTrip" method="dialog" novalidate>
  <h2 id="fTripH">새 여행</h2>
  <label>여행 이름<input id="tTitle" maxlength="60" placeholder="예: 겨울 부산 가족여행"></label>
  <label>여행지<input id="tDest" maxlength="60" placeholder="예: 부산"></label>
  <div class="grid2">
    <label>출발일<input id="tStart" type="date"></label>
    <label>도착일<input id="tEnd" type="date"></label>
  </div>
  <label>메모<textarea id="tMemo" maxlength="500" placeholder="예약 번호, 렌터카 정보 등"></textarea></label>
  <p class="err" id="tErr"></p>
  <div class="row between">
    <button type="button" class="btn danger" id="tDel">여행 삭제</button>
    <span class="row"><button type="button" class="btn ghost" data-close>취소</button><button class="btn primary">저장</button></span>
  </div>
</form></dialog>

<dialog id="dlgItem"><form id="fItem" method="dialog" novalidate>
  <h2 id="fItemH">일정 추가</h2>
  <div id="searchBox" class="col" style="gap:8px">
    <label>장소 검색 (카카오맵)<span class="row" style="flex-wrap:nowrap"><input id="iQuery" placeholder="예: 해운대해수욕장" enterkeyhint="search"><button type="button" class="btn" id="iSearch" style="flex:0 0 auto">검색</button></span></label>
    <ul class="results" id="iResults"></ul>
  </div>
  <p class="picked" id="iPicked"></p>
  <label>장소·일정 이름<input id="iTitle" maxlength="60" placeholder="검색 결과를 고르면 채워집니다"></label>
  <label>주소<input id="iAddr" maxlength="120"></label>
  <div class="grid2">
    <label>날짜<select id="iDate"></select></label>
    <label>시간<input id="iTime" type="time"></label>
  </div>
  <div class="grid2">
    <label>구분<select id="iKind">
      <option value="sight">관광</option><option value="stay">숙소</option><option value="food">식사</option><option value="move">이동</option><option value="etc">기타</option>
    </select></label>
    <label>여기까지 이동수단<select id="iMove">
      <option value="car">자가용</option><option value="traffic">대중교통</option><option value="walk">도보</option>
    </select></label>
  </div>
  <label>예상 비용 (원)<input id="iCost" type="number" min="0" step="1000" inputmode="numeric"></label>
  <label>메모<textarea id="iMemo" maxlength="500" placeholder="예약 시간, 입장료, 주차 등"></textarea></label>
  <p class="err" id="iErr"></p>
  <div class="row between">
    <button type="button" class="btn danger" id="iDel">삭제</button>
    <span class="row"><button type="button" class="btn ghost" data-close>취소</button><button class="btn primary">저장</button></span>
  </div>
</form></dialog>

<dialog id="dlgSet"><form id="fSet" method="dialog" novalidate>
  <h2>설정</h2>
  <fieldset><legend>카카오맵</legend>
    <label>JavaScript 키 (지도·장소 검색)<input id="sJs" autocomplete="off" spellcheck="false"></label>
    <label>REST API 키 (자가용·대중교통·도보 경로)<input id="sRest" autocomplete="off" spellcheck="false"></label>
  </fieldset>
  <fieldset><legend>기상청 단기예보 (공공데이터포털)</legend>
    <label>서비스 키 (인코딩·디코딩 키 모두 가능)<input id="sKma" autocomplete="off" spellcheck="false"></label>
  </fieldset>
  <fieldset><legend>가족 공유 (Firebase)</legend>
    <label>Firebase 웹 앱 구성 (콘솔의 firebaseConfig 붙여넣기)<textarea id="sFb" spellcheck="false" placeholder='apiKey: "...", authDomain: "...", projectId: "...", appId: "..."'></textarea></label>
    <label>가족 코드 (같은 코드를 쓰는 기기끼리 공유)<input id="sFam" autocomplete="off" spellcheck="false"></label>
    <button type="button" class="btn" id="sInvite">가족 초대 링크 복사</button>
    <p class="small muted">초대 링크에는 위 키가 모두 담깁니다. 가족에게만 보내세요.</p>
  </fieldset>
  <fieldset><legend>점검·백업</legend>
    <div class="row"><button type="button" class="btn" id="sTest">연결 테스트</button><button type="button" class="btn" id="sExport">백업 파일 저장</button><label class="btn" style="flex-direction:row;color:var(--ink)">백업 불러오기<input id="sImport" type="file" accept="application/json,.json" hidden></label></div>
    <pre id="sOut"></pre>
  </fieldset>
  <p class="err" id="sErr"></p>
  <div class="row between"><a class="small" href="https://github.com/shy8915/family-trip#readme" id="sGuide" target="_blank" rel="noopener">키 발급 안내</a><span class="row"><button type="button" class="btn ghost" data-close>닫기</button><button class="btn primary">저장</button></span></div>
</form></dialog>

<dialog id="dlgC"><form method="dialog">
  <h2 id="cTitle">삭제할까요?</h2>
  <p id="cMsg"></p>
  <div class="row between"><span></span><span class="row"><button type="button" class="btn ghost" data-close>취소</button><button type="button" class="btn primary" id="cOk">삭제</button></span></div>
</form></dialog>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const KIND={sight:"관광",stay:"숙소",food:"식사",move:"이동",etc:"기타"};
const MOVE={car:"자가용",traffic:"대중교통",walk:"도보"};
const WD=["일","월","화","수","목","금","토"];
const LS_T="ft.trips.v2", LS_C="ft.cfg.v2";
const KM="https://map.kakao.com/link/";
const LINE={car:"#2563eb",traffic:"#d9480f",walk:"#6b7280"};

function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
const S={trips:lsGet(LS_T,{}),view:"list",tripId:null,tab:"plan",day:null,mapDay:null,cfg:Object.assign({js:"",rest:"",kma:"",fb:null,fam:"",synced:false},lsGet(LS_C,{}))};
const DEFAULT_JS="c41b7da34d9a206589a9ccd1e9ca1d29"; // 카카오 JavaScript 키: 등록 도메인에서만 동작하는 공개용 키
if(!S.cfg.js)S.cfg.js=DEFAULT_JS;
// Firebase 웹 앱 구성: 클라이언트 코드에 넣도록 설계된 공개 식별값. 데이터 보호는 Firestore 보안 규칙과 가족 코드가 담당
const DEFAULT_FB={apiKey:"AIzaSyB8GfkesvY09xAnonxWwF2gHEH_bIh8_-A",authDomain:"family-trip-13a34.firebaseapp.com",projectId:"family-trip-13a34",storageBucket:"family-trip-13a34.firebasestorage.app",messagingSenderId:"1093207520086",appId:"1:1093207520086:web:100f4dca7123662aec1cf7"};
if(!S.cfg.fb)S.cfg.fb=DEFAULT_FB;
if(!S.cfg.fam){S.cfg.fam="fam"+Date.now().toString(36)+Math.random().toString(36).slice(2,12);S.cfg.synced=false}
lsSet(LS_C,S.cfg);
let col=null, drawToken=0;

/* ---------- 도우미 ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>(n<10?"0":"")+n;
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const p=String(s).split("-");return new Date(+p[0],+p[1]-1,+p[2])};
const today=()=>iso(new Date());
const validDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||"")&&!isNaN(parse(s));
const md=s=>{const d=parse(s);return (d.getMonth()+1)+"/"+d.getDate()+"("+WD[d.getDay()]+")"};
const full=s=>{const d=parse(s);return d.getFullYear()+". "+(d.getMonth()+1)+". "+d.getDate()+". ("+WD[d.getDay()]+")"};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/86400000);
function daysOf(t){const out=[];if(!validDate(t.start)||!validDate(t.end))return out;const n=Math.min(Math.max(diffDays(t.start,t.end),0),59);const d=parse(t.start);for(let i=0;i<=n;i++){out.push(iso(d));d.setDate(d.getDate()+1)}return out}
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const itemsOn=(t,date)=>(t.items||[]).filter(i=>i.date===date).sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99"));

async function kget(url){

}
const routeCache=new Map();
const pairs=v=>{const o=[];for(let i=0;i+1<v.length;i+=2)o.push([v[i+1],v[i]]);return o};
function routeFor(a,b,mode){
  const key=[mode,a.lat,a.lng,b.lat,b.lng].join("|");
  if(!routeCache.has(key))routeCache.set(key,fetchRoute(a,b,mode).catch(e=>({ok:false,msg:e.message||"경로 조회 실패"})));
  return routeCache.get(key);
}
async function fetchRoute(a,b,mode){
  if(mode==="car"){
    const j=await kget("https://apis-navi.kakaomobility.com/v1/directions?origin="+a.lng+","+a.lat+"&destination="+b.lng+","+b.lat+"&priority=RECOMMEND");
    const r=j&&j.routes&&j.routes[0];
    if(!r||r.result_code!==0)throw new Error((r&&r.result_msg)||"경로 없음");
    const s=r.summary||{},f=s.fare||{},bits=[];
    if(f.toll)bits.push("통행료 "+won(f.toll));
    if(f.taxi)bits.push("택시 약 "+won(f.taxi));
    const path=[];(r.sections||[]).forEach(sec=>(sec.roads||[]).forEach(rd=>pairs(rd.vertexes||[]).forEach(p=>path.push(p))));
    return {ok:true,min:(s.duration||0)/60,dist:s.distance||0,detail:bits.join(" · "),path};
  }
  const q="start_x="+a.lng+"&start_y="+a.lat+"&end_x="+b.lng+"&end_y="+b.lat;
  if(mode==="traffic"){
    const j=await kget("https://dapi.kakao.com/v2/routing/publictraffic?"+q);
    if(j.status&&j.status!=="OK")throw new Error(j.status==="NO_RESULTS"?"대중교통 경로 없음":j.status==="EQUAL_POINTS"?"출발지와 도착지가 같음":"경로 없음 ("+j.status+")");
    const r=j.routes&&j.routes[0];if(!r)throw new Error("대중교통 경로 없음");
    const p=r.properties||r,steps=r.steps||[],names=[],path=[];
    steps.forEach(st=>{const sp=st.properties||st;if(sp.type&&sp.type!=="WALKING"){const v=(sp.vehicles||[])[0];names.push((v&&v.name)||(sp.type==="SUBWAY"?"지하철":"버스"))}
      (((st.path||{}).points)||[]).forEach(xy=>path.push([xy[1],xy[0]]))});
    const bits=[];if(names.length)bits.push(names.join(" → "));if(p.transfers!=null)bits.push("환승 "+p.transfers+"회");if(p.fare&&p.fare.value)bits.push(won(p.fare.value));
    return {ok:true,min:(p.totalTime||0)/60,dist:p.totalDistance||0,detail:bits.join(" · "),path,url:(j.properties||{}).landingURL};
  }
  const j=await kget("https://dapi.kakao.com/v2/routing/walk?"+q);
  if(j.status&&j.status!=="OK")throw new Error(j.status==="TOO_FAR_AWAY"?"도보로 가기엔 너무 멉니다":"도보 경로 없음 ("+j.status+")");
  const r=j.route;if(!r)throw new Error("도보 경로 없음");
  const p=r.properties||r,path=[];
  (r.legs||[]).forEach(l=>(l.steps||[]).forEach(st=>(((st.path||{}).points)||[]).forEach(xy=>path.push([xy[1],xy[0]]))));
  return {ok:true,min:(p.totalTime||0)/60,dist:p.totalDistance||0,detail:"",path,url:p.landingUrl};
}

/* ---------- 기상청 단기예보 ---------- */
function grid(lat,lng){ // 기상청 격자 변환 (Lambert Conformal Conic, 5km 격자)
  const RE=6371.00877,GRID=5.0,SLAT1=30,SLAT2=60,OLON=126,OLAT=38,XO=43,YO=136,D=Math.PI/180;
  const re=RE/GRID,s1=SLAT1*D,s2=SLAT2*D,ol=OLON*D,oa=OLAT*D;
  let sn=Math.tan(Math.PI*.25+s2*.5)/Math.tan(Math.PI*.25+s1*.5);sn=Math.log(Math.cos(s1)/Math.cos(s2))/Math.log(sn);
  let sf=Math.tan(Math.PI*.25+s1*.5);sf=Math.pow(sf,sn)*Math.cos(s1)/sn;
  let ro=Math.tan(Math.PI*.25+oa*.5);ro=re*sf/Math.pow(ro,sn);
  let ra=Math.tan(Math.PI*.25+lat*D*.5);ra=re*sf/Math.pow(ra,sn);
  let th=lng*D-ol;if(th>Math.PI)th-=2*Math.PI;if(th<-Math.PI)th+=2*Math.PI;th*=sn;
  return {nx:Math.floor(ra*Math.sin(th)+XO+.5),ny:Math.floor(ro-ra*Math.cos(th)+YO+.5)};
}
function baseTime(nowMs){ // 발표시각 02·05·08·11·14·17·20·23시(KST), 여유 15분
  const k=new Date(nowMs+9*3600000-15*60000);let h=k.getUTCHours();
  let b=Math.floor((h-2)/3)*3+2;
  if(h<2){k.setUTCDate(k.getUTCDate()-1);b=23}
  return {date:k.getUTCFullYear()+pad(k.getUTCMonth()+1)+pad(k.getUTCDate()),time:pad(b)+"00"};
}
const wxCache=new Map();
function forecast(lat,lng){
  const g=grid(lat,lng),bt=baseTime(Date.now()),key=g.nx+","+g.ny+","+bt.date+bt.time;
  if(!wxCache.has(key)){
    let cached=null;try{cached=JSON.parse(sessionStorage.getItem("wx."+key))}catch(e){}
    wxCache.set(key,cached?Promise.resolve(cached):fetchFcst(g,bt).then(v=>{try{sessionStorage.setItem("wx."+key,JSON.stringify(v))}catch(e){}return v}).catch(e=>({ok:false,msg:e.message||"예보 조회 실패"})));
  }
  return wxCache.get(key);
}
async function fetchFcst(g,bt){
  if(!S.cfg.kma)throw new Error("기상청 서비스 키 없음");
  let key=S.cfg.kma.trim();if(/%[0-9A-Fa-f]{2}/.test(key)){try{key=decodeURIComponent(key)}catch(e){}}
  const hours={};let page=1,total=Infinity,got=0;
  while(got<total&&page<=3){
    const u="https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getVilageFcst?serviceKey="+encodeURIComponent(key)+"&pageNo="+page+"&numOfRows=1000&dataType=JSON&base_date="+bt.date+"&base_time="+bt.time+"&nx="+g.nx+"&ny="+g.ny;
    let txt;
    try{const r=await fetch(u);txt=await r.text()}catch(e){throw new Error("기상청 API에 연결할 수 없습니다 (브라우저 차단 또는 네트워크)")}
    let j=null;try{j=JSON.parse(txt)}catch(e){}
    if(!j){const m=txt.match(/<(?:returnAuthMsg|errMsg|cmmMsgHeader)>([^<]+)/);throw new Error("기상청 API 오류: "+(m?m[1]:"응답 형식 오류"))}
    const oe=j.OpenAPI_ServiceResponse&&j.OpenAPI_ServiceResponse.cmmMsgHeader;if(oe)throw new Error("기상청 API 오류: "+(oe.returnAuthMsg||oe.errMsg||"인증 실패")+(/NOT_REGISTERED/.test(oe.returnAuthMsg||oe.errMsg||"")?" (키 등록 직후에는 반영까지 시간이 걸릴 수 있습니다)":""));
    const h=j.response&&j.response.header,b=j.response&&j.response.body;
    if(!h||h.resultCode!=="00")throw new Error("기상청 API 오류: "+((h&&h.resultMsg)||"알 수 없음"));
    const arr=(b&&b.items&&b.items.item)||[];
    arr.forEach(it=>{const k=it.fcstDate+it.fcstTime;(hours[k]=hours[k]||{})[it.category]=it.fcstValue});
    total=(b&&b.totalCount)||arr.length;got+=arr.length;page++;
    if(!arr.length)break;
  }
  return {ok:true,hours,base:bt};
}
function skyText(sky,pty){pty=+pty||0;if(pty===1)return "비";if(pty===2)return "비/눈";if(pty===3)return "눈";if(pty===4)return "소나기";sky=+sky;return sky===1?"맑음":sky===3?"구름많음":sky===4?"흐림":""}
function daySummary(f,date){
  const d=date.replace(/-/g,""),tmp=[],words={};let tmn=null,tmx=null,pop=null,n=0;
  Object.keys(f.hours).forEach(k=>{if(k.slice(0,8)!==d)return;const h=f.hours[k],hr=+k.slice(8,10);n++;
    if(h.TMP!=null&&!isNaN(+h.TMP))tmp.push(+h.TMP);
    if(h.TMN!=null&&!isNaN(+h.TMN))tmn=+h.TMN;if(h.TMX!=null&&!isNaN(+h.TMX))tmx=+h.TMX;
    if(h.POP!=null&&!isNaN(+h.POP))pop=Math.max(pop==null?0:pop,+h.POP);
    if(hr>=6&&hr<=21){const w=skyText(h.SKY,h.PTY);if(w)words[w]=(words[w]||0)+((+h.PTY||0)>0?3:1)}});
  if(!n)return null;
  if(tmn==null&&tmp.length)tmn=Math.min.apply(null,tmp);if(tmx==null&&tmp.length)tmx=Math.max.apply(null,tmp);
  const sky=Object.keys(words).sort((a,b)=>words[b]-words[a])[0]||"";
  return {sky,tmn,tmx,pop};
}
function wxPlace(t,date){const it=itemsOn(t,date).filter(hasXY);if(it.length)return it[0];const all=(t.items||[]).filter(hasXY);return all.filter(i=>i.kind==="stay")[0]||all[0]||null}

      el.innerHTML='<b>'+esc(s.sky||"예보")+'</b>'+(s.tmn!=null?'<span class="num">'+Math.round(s.tmn)+' / '+Math.round(s.tmx)+'℃</span>':'')+(s.pop!=null?'<span class="num">강수확률 최대 '+s.pop+'%</span>':'')+
        '<span class="wx-src">'+esc(p.title)+' 기준 · 기상청 단기예보 '+(+f.base.date.slice(4,6))+'/'+(+f.base.date.slice(6))+' '+f.base.time.slice(0,2)+'시 발표</span>';

      if(!f.ok||!el.isConnected)return;
      const h=f.hours[it.date.replace(/-/g,"")+it.time.slice(0,2)+"00"];if(!h||h.TMP==null)return;
      el.textContent=it.time.slice(0,2)+"시 예보 "+Math.round(+h.TMP)+"℃ "+skyText(h.SKY,h.PTY)+(+h.POP>=30?" · 강수 "+h.POP+"%":"");
    });
  });
}

function legStatic(a,b){

  return MOVE[m]+' 경로 계산 중';
}
function legResult(a,b,r){
  const m=MOVE[b.move]?b.move:"car",link='<a href="'+esc(r.url||legLink(a,b,m))+'" target="_blank" rel="noopener">카카오맵 길찾기</a>';
  if(!r.ok){const R=6371000,D=Math.PI/180,x=(b.lng-a.lng)*D*Math.cos((a.lat+b.lat)/2*D),y=(b.lat-a.lat)*D;return MOVE[m]+' · 직선거리 '+km(Math.sqrt(x*x+y*y)*R)+' · <span>'+esc(r.msg)+'</span>'+link}
  let h='<b>'+MOVE[m]+' '+dur(r.min)+'</b><span class="num">'+km(r.dist)+'</span>'+(r.detail?'<span>'+esc(r.detail)+'</span>':'');
  const ta=mins(a.time),tb=mins(b.time);

function loadLegs(t){

async function drawMap(t){
  const my=drawToken,el=$("map");if(!el)return;
  const days=daysOf(t),list=S.mapDay==="all"?days:[S.mapDay];
  let k;
  try{k=await loadKakao()}catch(e){if(my===drawToken&&el.isConnected)el.innerHTML='<div class="empty" style="border:0">'+esc(e.message)+'<br>설정에서 카카오 JavaScript 키와 등록 도메인을 확인하세요.</div>';return}
  if(my!==drawToken||!el.isConnected)return;
  const map=new k.maps.Map(el,{center:new k.maps.LatLng(36.35,127.38),level:12});
  const bounds=new k.maps.LatLngBounds();let any=false;
  const line=(path,mode,solid)=>new k.maps.Polyline({map,path:path.map(p=>new k.maps.LatLng(p[0],p[1])),strokeWeight:5,strokeColor:LINE[mode]||LINE.walk,strokeOpacity:.85,strokeStyle:solid?"solid":"shortdash"});
  list.forEach(d=>{
    const items=itemsOn(t,d);let n=0,prev=null;
    items.forEach(it=>{n++;if(!hasXY(it))return;
      const pos=new k.maps.LatLng(it.lat,it.lng);bounds.extend(pos);any=true;
      const kk=KIND[it.kind]?it.kind:"etc";
      new k.maps.CustomOverlay({map,position:pos,yAnchor:1.15,content:'<div class="pin k-'+kk+'" title="'+esc(it.title)+'"><span>'+n+'</span></div>'});
      if(prev){const a=prev,b=it,m=MOVE[b.move]?b.move:"car";
        if(S.cfg.rest){routeFor(a,b,m).then(r=>{if(my!==drawToken)return;if(r.ok&&r.path.length>1)line(r.path,m,m!=="walk");else line([[a.lat,a.lng],[b.lat,b.lng]],"walk",false)})}
        else line([[a.lat,a.lng],[b.lat,b.lng]],"walk",false)}
      prev=it});
  });
  if(any)map.setBounds(bounds,40,40,40,40);
}

function parseFb(txt){
  txt=(txt||"").trim();if(!txt)return null;const o={};
  ["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId"].forEach(k=>{const m=txt.match(new RegExp('["\']?'+k+'["\']?\\s*:\\s*["\']([^"\']+)["\']'));if(m)o[k]=m[1]});
  return o.apiKey&&o.projectId?o:false;
}
function openSettings(){
  const c=S.cfg;$("sJs").value=c.js;$("sRest").value=c.rest;$("sKma").value=c.kma;
  $("sFb").value=c.fb?Object.keys(c.fb).map(k=>k+': "'+c.fb[k]+'"').join(",\n"):"";
  $("sFam").value=c.fam||"";$("sErr").textContent="";$("sOut").textContent="";$("dlgSet").showModal();
}
function readSettings(){
  const fb=parseFb($("sFb").value)||(($("sFb").value.trim())?false:DEFAULT_FB);
  if(fb===false){$("sErr").textContent="Firebase 구성에서 apiKey와 projectId를 찾지 못했습니다. 콘솔의 firebaseConfig 전체를 붙여 넣어 주세요.";return null}
  let fam=$("sFam").value.trim().replace(/[^A-Za-z0-9_-]/g,"");
  if(fb&&!fam)fam=newId("fam")+Math.random().toString(36).slice(2,10);
  if(fb&&fam.length<12){$("sErr").textContent="가족 코드는 12자 이상의 영문·숫자로 정해 주세요. 비워 두면 자동으로 만듭니다.";return null}
  return {js:$("sJs").value.trim()||DEFAULT_JS,rest:$("sRest").value.trim(),kma:$("sKma").value.trim(),fb:fb||null,fam};
}
function applySettings(n){
  const o=S.cfg,reload=o.js!==n.js||JSON.stringify(o.fb)!==JSON.stringify(n.fb)||o.fam!==n.fam;
  S.cfg=Object.assign({},n,{synced:(JSON.stringify(o.fb)===JSON.stringify(n.fb)&&o.fam===n.fam)?o.synced:false});

});
$("sTest").addEventListener("click",async()=>{
  const n=readSettings();if(!n)return;const out=$("sOut"),L=[];const say=s=>{L.push(s);out.textContent=L.join("\n")};
  const keep=S.cfg;S.cfg=Object.assign({},keep,n);routeCache.clear();wxCache.clear();
  say("점검을 시작합니다.");
  try{if(n.js!==keep.js&&window.kakao)say("지도: 키를 바꿨습니다. 저장 후 다시 점검하세요.");else{await loadKakao();say("지도 SDK: 정상")}}catch(e){say("지도 SDK: 실패 — "+e.message)}
  const A={lat:37.5547,lng:126.9707},B={lat:37.5796,lng:126.9770};
  for(const m of ["car","traffic","walk"]){if(!n.rest){say(MOVE[m]+" 경로: REST 키 없음");continue}
    try{const r=await fetchRoute(A,B,m);say(MOVE[m]+" 경로: 정상 (서울역→경복궁 "+dur(r.min)+")")}catch(e){say(MOVE[m]+" 경로: 실패 — "+e.message+" (카카오맵 링크로 대체)")}}
  if(!n.kma)say("기상청 예보: 서비스 키 없음");
  else{try{const f=await fetchFcst(grid(A.lat,A.lng),baseTime(Date.now()));say("기상청 예보: 정상 ("+Object.keys(f.hours).length+"시간분 수신)")}catch(e){say("기상청 예보: 실패 — "+e.message)}}
  say(n.fb?(col?"가족 공유: 연결됨":"가족 공유: 저장 후 연결됩니다"):"가족 공유: 구성 없음 (이 기기에만 저장)");
  S.cfg=keep;routeCache.clear();wxCache.clear();
});
$("sExport").addEventListener("click",()=>{
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({app:"family-trip",exportedAt:new Date().toISOString(),trips:S.trips},null,1)],{type:"application/json"}));
  a.download="family-trips-"+today()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
});
$("sImport").addEventListener("change",e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{const j=JSON.parse(rd.result),src=j.trips||j;let n=0;Object.keys(src).forEach(id=>{if(!/^[A-Za-z0-9_-]{3,40}$/.test(id)||!src[id]||typeof src[id]!=="object")return;S.trips[id]=norm(src[id],id);persist(id);n++});$("sOut").textContent="여행 "+n+"건을 불러왔습니다.";render()}catch(err){$("sOut").textContent="불러오지 못했습니다. 이 앱에서 저장한 백업 파일인지 확인하세요."}};
  rd.readAsText(f);
});

/* ---------- 이벤트 ---------- */
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-close]");if(c){c.closest("dialog").close();return}
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.getAttribute("data-act"),t=S.trips[S.tripId];
  if(a==="settings")openSettings();
  else if(a==="newTrip")openTrip(null);
  else if(a==="open"){S.view="trip";S.tripId=b.getAttribute("data-id");S.tab="plan";S.day=null;S.mapDay=null;render();window.scrollTo(0,0)}
  else if(a==="back"){S.view="list";S.tripId=null;render();window.scrollTo(0,0)}
  else if(!t)return;
  else if(a==="editTrip")openTrip(t);
  else if(a==="tab"){S.tab=b.getAttribute("data-tab");if(S.tab==="map")S.mapDay=S.day;render()}
  else if(a==="day"){S.day=b.getAttribute("data-day");if(b.getAttribute("data-go"))S.tab="plan";render()}
  else if(a==="mapDay"){S.mapDay=b.getAttribute("data-day");if(S.mapDay!=="all")S.day=S.mapDay;render()}
  else if(a==="newItem")openItem(null);
  else if(a==="editItem"){const id=b.getAttribute("data-id");openItem(t.items.filter(x=>x.id===id)[0])}
  else if(a==="delCheck"){const id=b.getAttribute("data-id");t.checklist=t.checklist.filter(x=>x.id!==id);commit(t)}
  else if(a==="share"){const text=shareText(t);if(navigator.share){navigator.share({title:t.title,text}).catch(()=>{})}else copy(text,"일정을 복사했습니다. 메신저에 붙여 넣으세요.")}
});
document.addEventListener("change",e=>{
  const id=e.target.getAttribute&&e.target.getAttribute("data-ck");if(!id)return;
  const t=S.trips[S.tripId];if(!t)return;const x=t.checklist.filter(y=>y.id===id)[0];if(!x)return;x.done=e.target.checked;commit(t);
});

/* ---------- 시작 ---------- */
Object.keys(S.trips).forEach(id=>{S.trips[id]=norm(S.trips[id],id)});

function tryJoin(){
  const m=location.hash.match(/^#join=([A-Za-z0-9_-]+)$/);if(!m)return false;
  let n=null;try{n=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,"+").replace(/_/g,"/")))))}catch(e){}
  history.replaceState(null,"",location.pathname);
  if(!n||typeof n!=="object"){toast("초대 링크가 올바르지 않습니다");return false}
  const clean={js:String(n.js||""),rest:String(n.rest||""),kma:String(n.kma||""),fb:n.fb&&typeof n.fb==="object"?n.fb:null,fam:String(n.fam||"").replace(/[^A-Za-z0-9_-]/g,"")};
  ask("가족 초대 링크의 설정(API 키와 가족 공유)을 이 기기에 저장합니다. 가족이 보낸 링크가 맞을 때만 진행하세요.",()=>applySettings(clean),"가족 설정을 받을까요?","저장");
  return true;
}
render();
tryJoin();
initCloud();
})();
</script>
